<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteo Gala GJ | 3DCC Salamanca</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="manifest" href="icons/site.webmanifest">
    <link rel="shortcut icon" href="icons/favicon.ico">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Participa en el sorteo de la Gala GJ - 3DCC Salamanca">
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2c3e50',
                        secondary: '#34495e',
                        accent: '#3498db',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                        'slide-up': 'slide-up 0.6s ease-out forwards',
                        'bounce-soft': 'bounce-soft 2s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* Animated gradient background */
        .gradient-bg {
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(52, 152, 219, 0.4);
            border-radius: 50%;
            animation: float-particle 20s infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            animation-duration: 25s;
        }

        .particle:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
            animation-duration: 20s;
        }

        .particle:nth-child(3) {
            left: 30%;
            animation-delay: 4s;
            animation-duration: 28s;
        }

        .particle:nth-child(4) {
            left: 40%;
            animation-delay: 1s;
            animation-duration: 22s;
        }

        .particle:nth-child(5) {
            left: 50%;
            animation-delay: 3s;
            animation-duration: 24s;
        }

        @keyframes float-particle {

            0%,
            100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }

            90% {
                opacity: 1;
                transform: translateY(10vh) scale(1);
            }

            100% {
                transform: translateY(-10vh) scale(0);
                opacity: 0;
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
            }

            50% {
                box-shadow: 0 0 40px rgba(52, 152, 219, 0.6), 0 0 60px rgba(52, 152, 219, 0.3);
            }
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce-soft {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .fade-in {
            animation: slide-up 0.6s ease-out forwards;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen text-white">
    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex flex-col items-center px-4 py-8">

        <!-- Formulario de participación -->
        <div id="participationForm" class="w-full max-w-md hidden">
            <div class="text-center mb-8 fade-in">
                <div
                    class="w-24 h-24 mx-auto mb-4 rounded-full bg-gradient-to-br from-pink-400 to-red-500 flex items-center justify-center shadow-lg">
                    <img src="images/GJP.svg" alt="GJ Icon" class="w-12 h-12" />
                </div>
                <h1
                    class="text-3xl font-extrabold mb-2 bg-gradient-to-r from-white via-pink-200 to-red-200 bg-clip-text text-transparent">
                    ¡Participa en el Sorteo!
                </h1>
                <p class="text-gray-300 text-lg">Gala GJ - 3DCC Salamanca</p>
            </div>

            <form id="giveawayForm"
                class="backdrop-filter backdrop-blur-lg bg-white/10 rounded-2xl p-6 border border-white/20 shadow-2xl fade-in">
                <div class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-200 mb-2">Nombre completo</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-200 mb-2">Teléfono</label>
                        <input type="tel" id="phone" name="phone" required placeholder="666 123 456"
                            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition">
                    </div>

                    <div class="flex items-start gap-3 pt-2">
                        <input type="checkbox" id="terms" name="terms" required
                            class="mt-1 w-4 h-4 rounded border-white/20 bg-white/5 text-pink-500 focus:ring-2 focus:ring-pink-500">
                        <label for="terms" class="text-sm text-gray-300">
                            Acepto las <a href="terminos.html" target="_blank"
                                class="text-pink-400 hover:text-pink-300 underline">bases del sorteo</a> y el
                            tratamiento de mis datos
                        </label>
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-pink-500 to-red-500 text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-pink-500/50 transition-all hover:-translate-y-1 active:scale-95">
                        Participar en el Sorteo
                    </button>
                </div>
            </form>
        </div>

        <!-- Mensaje de confirmación -->
        <div id="confirmationMessage" class="w-full max-w-md hidden">
            <div class="text-center fade-in">
                <div
                    class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center shadow-lg animate-bounce">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                        stroke="currentColor" class="w-12 h-12 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                </div>

                <h1
                    class="text-3xl font-extrabold mb-4 bg-gradient-to-r from-white via-green-200 to-emerald-200 bg-clip-text text-transparent">
                    ¡Ya estás participando!
                </h1>

                <div
                    class="backdrop-filter backdrop-blur-lg bg-white/10 rounded-2xl p-6 border border-white/20 shadow-2xl mb-6">
                    <p class="text-gray-200 text-lg mb-3">Gracias por participar en el sorteo de la Gala GJ</p>
                    <p class="text-gray-300 text-sm">Te avisaremos si resultas ganador/a. ¡Mucha suerte! 🎉</p>
                </div>

                <a href="qr.html"
                    class="inline-flex items-center gap-2 bg-gradient-to-r from-accent to-blue-600 text-white font-semibold px-6 py-3 rounded-full hover:shadow-lg hover:shadow-accent/30 transition-all hover:-translate-y-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                    Volver
                </a>
            </div>
        </div>

    </main>

    <script>
        // Nombre de la cookie
        const COOKIE_NAME = 'giveaway_participated';
        const COOKIE_DAYS = 7;

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxulqsRSH-sNzu_Xz_jBG9t_DAHGfbjDsnrPfB05U6xPeooVp8L50WaQN4UenwFO2I_Iw/exec';

        // Función para obtener una cookie
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // Función para establecer una cookie
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value};${expires};path=/`;
        }

        // Función para enviar datos a Google Sheets
        async function saveToGoogleSheets(participant) {
            let userIP = null
            try {
                const responseIp = await fetch('https://ipinfo.io/json?token=11acd7f5e7a1ac');
                const dataIp = await responseIp.json();
                userIP = dataIp.ip;
            } catch (error) {
                console.error('Error fetching IP address:', error);
            }

            participant.userIP = userIP;

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Importante para evitar problemas CORS
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(participant)
                });

                // Con no-cors no podemos leer la respuesta, pero asumimos que funcionó
                return true;
            } catch (error) {
                console.error('Error enviando a Google Sheets:', error);
                return false;
            }
        }

        // Comprobar si ya participó al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const hasParticipated = getCookie(COOKIE_NAME);

            if (hasParticipated) {
                // Ya participó - mostrar mensaje de confirmación
                document.getElementById('confirmationMessage').classList.remove('hidden');
            } else {
                // No ha participado - mostrar formulario
                document.getElementById('participationForm').classList.remove('hidden');
            }
        });

        // Manejar el envío del formulario
        document.getElementById('giveawayForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Deshabilitar botón mientras se procesa
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            // Crear objeto con datos del participante
            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                timestamp: new Date().toISOString()
            };

            // Enviar a Google Sheets
            await saveToGoogleSheets(formData);

            // Establecer la cookie de participación
            setCookie(COOKIE_NAME, 'true', COOKIE_DAYS);

            // Ocultar formulario y mostrar mensaje de confirmación
            document.getElementById('participationForm').classList.add('hidden');
            document.getElementById('confirmationMessage').classList.remove('hidden');
        });
    </script>
</body>

</html>
