<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sorteo - 3DCC</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .winner-highlight {
            animation: pulse-winner 1s ease-in-out 3;
        }

        @keyframes pulse-winner {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background-color: rgba(34, 197, 94, 0.3); }
        }
    </style>
</head>

<body class="gradient-bg min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        
        <!-- Login Screen -->
        <div id="loginScreen" class="max-w-md mx-auto">
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 border border-white/20">
                <h1 class="text-3xl font-bold mb-6 text-center">Panel de Administración</h1>
                <p class="text-gray-300 mb-6 text-center">Sorteo Gala GJ</p>
                
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-200 mb-2">Contraseña</label>
                        <input type="password" id="password" 
                            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Introduce la contraseña">
                    </div>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 rounded-xl hover:shadow-lg transition-all">
                        Acceder
                    </button>
                </form>
                <p class="text-xs text-gray-400 mt-4 text-center">Pista: 3D + año fundación</p>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-4xl font-bold">Panel de Sorteo</h1>
                <button onclick="logout()" class="px-4 py-2 bg-red-500 rounded-lg hover:bg-red-600 transition">
                    Cerrar Sesión
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                    <div class="text-sm text-gray-300 mb-2">Total Participantes</div>
                    <div class="text-4xl font-bold" id="totalParticipants">0</div>
                </div>
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                    <div class="text-sm text-gray-300 mb-2">Última Participación</div>
                    <div class="text-lg font-semibold" id="lastParticipation">-</div>
                </div>
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                    <div class="text-sm text-gray-300 mb-2">Ganador</div>
                    <div class="text-lg font-semibold" id="winnerName">Pendiente de sorteo</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20 mb-8">
                <h2 class="text-2xl font-bold mb-4">Acciones</h2>
                <div class="flex flex-wrap gap-4">
                    <button onclick="runDraw()" 
                        class="px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl font-bold hover:shadow-lg transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        Realizar Sorteo
                    </button>
                    
                    <button onclick="loadParticipants()" 
                        class="px-6 py-3 bg-blue-600 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        Recargar Datos
                    </button>
                    
                    <button onclick="exportData()" 
                        class="px-6 py-3 bg-purple-600 rounded-xl font-bold hover:bg-purple-700 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                        </svg>
                        Exportar CSV
                    </button>
                    
                    <button onclick="copyData()" 
                        class="px-6 py-3 bg-indigo-600 rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                        </svg>
                        Copiar Datos
                    </button>
                    
                    <button onclick="clearData()" 
                        class="px-6 py-3 bg-red-600 rounded-xl font-bold hover:bg-red-700 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                        Limpiar Todo
                    </button>
                </div>
            </div>

            <!-- Participants List -->
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                <h2 class="text-2xl font-bold mb-4">Lista de Participantes</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-white/20">
                                <th class="text-left py-3 px-4 text-gray-300 font-semibold">#</th>
                                <th class="text-left py-3 px-4 text-gray-300 font-semibold">Nombre</th>
                                <th class="text-left py-3 px-4 text-gray-300 font-semibold">Teléfono</th>
                                <th class="text-left py-3 px-4 text-gray-300 font-semibold">Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="participantsList">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza esta URL con la URL de tu Google Apps Script
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxulqsRSH-sNzu_Xz_jBG9t_DAHGfbjDsnrPfB05U6xPeooVp8L50WaQN4UenwFO2I_Iw/exec';
        const PASSWORD = '3d2024'; // Cambia esto por tu contraseña
        let currentWinner = null;
        let participants = [];

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === PASSWORD) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadParticipants();
            } else {
                alert('Contraseña incorrecta');
            }
        });

        function logout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('password').value = '';
        }

        // Cargar participantes desde Google Sheets
        async function loadParticipants() {
            try {
                document.getElementById('totalParticipants').textContent = 'Cargando...';
                
                const response = await fetch(GOOGLE_SCRIPT_URL + '?action=getParticipants');
                const data = await response.json();
                
                if (data.result === 'success') {
                    participants = data.participants;
                } else {
                    throw new Error(data.error || 'Error al obtener datos');
                }
                
                // Actualizar estadísticas
                document.getElementById('totalParticipants').textContent = participants.length;
                
                if (participants.length > 0) {
                    const lastParticipant = participants[participants.length - 1];
                    const date = new Date(lastParticipant.timestamp);
                    document.getElementById('lastParticipation').textContent = 
                        `${lastParticipant.name} - ${date.toLocaleDateString('es-ES')}`;
                } else {
                    document.getElementById('lastParticipation').textContent = '-';
                }

                // Llenar tabla
                const tbody = document.getElementById('participantsList');
                tbody.innerHTML = '';
                
                if (participants.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-gray-400">No hay participantes todavía</td></tr>';
                    return;
                }
                
                participants.forEach((p, index) => {
                    const date = new Date(p.timestamp);
                    const row = document.createElement('tr');
                    row.className = 'border-b border-white/10 hover:bg-white/5 transition';
                    row.innerHTML = `
                        <td class="py-3 px-4">${index + 1}</td>
                        <td class="py-3 px-4 font-medium">${p.name}</td>
                        <td class="py-3 px-4 text-gray-300">${p.phone}</td>
                        <td class="py-3 px-4 text-gray-300 text-sm">${date.toLocaleDateString('es-ES')} ${date.toLocaleTimeString('es-ES')}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                alert('Error al cargar participantes: ' + error.message);
                document.getElementById('totalParticipants').textContent = 'Error';
            }
        }

        // Realizar sorteo
        function runDraw() {
            if (participants.length === 0) {
                alert('Primero debes cargar los participantes');
                return;
            }
            
            if (participants.length === 0) {
                alert('No hay participantes para sortear');
                return;
            }

            // Sorteo aleatorio con animación
            const winnerIndex = Math.floor(Math.random() * participants.length);
            currentWinner = participants[winnerIndex];

            // Mostrar ganador con animación
            document.getElementById('winnerName').textContent = currentWinner.name;
            document.getElementById('winnerName').parentElement.classList.add('winner-highlight');

            // Resaltar fila del ganador
            const rows = document.querySelectorAll('#participantsList tr');
            rows.forEach(row => row.classList.remove('winner-highlight'));
            rows[winnerIndex].classList.add('winner-highlight');
            rows[winnerIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Mostrar modal con información completa
            setTimeout(() => {
                alert(`🎉 ¡GANADOR DEL SORTEO! 🎉\n\nNombre: ${currentWinner.name}\nTeléfono: ${currentWinner.phone}\nFecha: ${new Date(currentWinner.timestamp).toLocaleString('es-ES')}`);
            }, 500);
        }

        // Exportar a CSV
        function exportData() {
            if (participants.length === 0) {
                alert('Primero debes cargar los participantes');
                return;
            }
            
            if (participants.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            // Crear CSV
            let csv = 'Nombre,Teléfono,Fecha\n';
            participants.forEach(p => {
                const date = new Date(p.timestamp).toLocaleString('es-ES');
                csv += `"${p.name}","${p.phone}","${date}"\n`;
            });

            // Descargar archivo
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `sorteo-gala-gj-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Copiar datos al portapapeles
        function copyData() {
            if (participants.length === 0) {
                alert('Primero debes cargar los participantes');
                return;
            }
            
            if (participants.length === 0) {
                alert('No hay datos para copiar');
                return;
            }

            const text = JSON.stringify(participants, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                alert('Datos copiados al portapapeles');
            });
        }

        // Limpiar todos los datos
        function clearData() {
            alert('⚠️ Esta función no está disponible con Google Sheets.\n\nPara eliminar participantes, ve directamente a tu Google Sheet y borra las filas necesarias.\n\nDespués recarga esta página para actualizar los datos.');
        }
    </script>
</body>

</html>
