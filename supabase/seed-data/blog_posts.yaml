- slug: "pla-vs-petg-que-filamento-elegir"
  title: "PLA, PETG, ABS, ASA y TPU: qué material elegir según para qué"
  excerpt: "Una tabla comparativa real, temperaturas exactas, y una regla de decisión simple para los cinco filamentos más usados en impresión FDM."
  content: |
    El material decide más que la impresora. Una pieza bien diseñada en el material equivocado se rompe; una pieza mediocre en el material correcto aguanta años. Estos son los cinco filamentos que cubren el 99% de nuestros encargos, con datos que podemos defender.

    ## Tabla comparativa

    | Material | T° imprimir | T° cama | Resiste hasta | Exterior | Imprime fácil |
    |---|---|---|---|---|---|
    | **PLA** | 200–220 °C | 55–60 °C | ~60 °C | ✗ | ★★★★★ |
    | **PETG** | 230–250 °C | 75–85 °C | ~80 °C | ✓ (años) | ★★★★ |
    | **ABS** | 240–260 °C | 100–110 °C | ~100 °C | ✓ pero amarillea | ★★ (cámara cerrada) |
    | **ASA** | 240–260 °C | 100–110 °C | ~100 °C | ★ Excelente | ★★ (cámara cerrada) |
    | **TPU 95A** | 220–235 °C | 50–60 °C | ~70 °C | ✓ | ★★★ (lento) |

    > **Glass transition** = temperatura a la que el plástico empieza a reblandecerse y deformarse bajo carga. Por encima de ese punto, la pieza pierde rigidez.

    ## PLA — el por defecto, y con razón

    Bioplástico derivado del almidón de maíz. No huele al imprimir, da muchísimo detalle, y aguanta cualquier uso de interior sin problemas.

    - **Cuándo elegirlo:** figuras, decoración, prototipos visuales, regalos, organizadores que no aguantan peso, juguetes.
    - **Cuándo NO:** dentro de un coche en agosto (el coche llega a 70 °C), soportes para el horno, anillos para tornillos que se aprietan a menudo (se rompen en frágil).
    - **Variantes útiles:** *PLA+* (más resistente al impacto), *PLA seda* (acabado brillante), *PLA madera* (mezcla con polvo de madera real, queda muy bien).

    ## PETG — el todoterreno

    El mismo plástico que las botellas de agua, modificado para imprimirse. Es el material que más usamos para piezas funcionales: aguanta golpes, sol y humedad sin despeinarse.

    - **Cuándo elegirlo:** soportes mecánicos, piezas para coche que no van al sol directo, organizadores que cargan peso, todo lo que se moje.
    - **Pegas reales:** produce más *stringing* (hilos finos entre paredes) que el PLA, y a veces se pega *demasiado* a la cama —puede arrancar trozos si no se separa con cuidado.

    ## ABS — el plástico de Lego

    El clásico. Resistente, mecanizable (se puede taladrar, lijar, atornillar). Su gran ventaja: se puede *vaporizar con acetona* para dejar un acabado liso casi como inyección.

    - **Cuándo elegirlo:** carcasas industriales, piezas que vayan a llevar tornillos auto-perforantes, prototipos que necesitan acabado.
    - **Pegas reales:** huele al imprimir (necesita cámara cerrada y ventilación), se contrae mucho —las piezas grandes pueden agrietarse o despegarse de la cama.

    ## ASA — el ABS moderno

    Misma resistencia mecánica que el ABS, pero con resistencia UV mucho mejor. Si una pieza va a vivir al sol durante años (coche, jardín, fachada), va en ASA.

    - **Cuándo elegirlo:** señalética exterior, retrovisores, soportes de placa solar, accesorios de jardín que aguanten.
    - **Misma pega que el ABS:** huele, necesita cámara cerrada.

    ## TPU — goma técnica

    Filamento flexible. La dureza se mide en *shore A*: 85A es muy blando (gomas elásticas), 95A es tipo zapatilla deportiva, 98A se acerca al PETG. El estándar es 95A.

    - **Cuándo elegirlo:** fundas para móvil, tacos antideslizantes, juntas, mangos blandos, ruedas de rover RC.
    - **Pegas reales:** imprime más lento (20–40 mm/s con la mayoría de impresoras), necesita extrusor *direct drive* (no Bowden).

    ## La regla rápida

    1. ¿Va a estar en interior y se ve? → **PLA**.
    2. ¿Va a aguantar peso, golpes o humedad? → **PETG**.
    3. ¿Va al sol durante años? → **ASA**.
    4. ¿Tiene que doblarse o amortiguar? → **TPU**.
    5. Si dudas entre PLA y PETG y no es decorativo → **PETG**. Siempre.

    Si quieres ver los colores que tenemos en stock por material, mira el [muestrario](/muestrario). Y si todavía no lo tienes claro, hay un pequeño test de 4 preguntas al principio que te dice cuál encaja en tu caso.
