- slug: "introduccion-impresion-3d-guia-principiantes"
  title: "Qué es realmente la impresión 3D (y para qué la usa la gente en 2026)"
  excerpt: "Una introducción honesta a la impresión 3D FDM desde el taller: cómo funciona, qué resuelve hoy, y dónde la fabricación tradicional sigue siendo mejor."
  content: |
    Un cliente entró el otro día con la tapa de un robot de cocina en una bolsa. Se le había roto la pestaña en 2018 y el fabricante llevaba años sin venderla. En 40 minutos la modelamos, en una hora la imprimimos en PETG negro, y el aparato volvió a casa funcionando. Coste: 6 €. Coste del aparato nuevo equivalente: 180 €.

    Esto es la impresión 3D en la práctica. No el chiste de "imprime tu propia casa", ni la fantasía de un Star Trek replicator: una herramienta concreta que resuelve problemas concretos.

    > **En resumen:** la impresión 3D FDM construye piezas de plástico capa a capa. Es perfecta para piezas únicas, prototipos y repuestos. No compite con la inyección a gran escala ni con el metal mecanizado, pero rellena un hueco que antes no tenía solución.

    ## Cómo funciona, en una frase
    Un hilo de plástico de 1.75 mm entra en un cabezal, se calienta a 200–260 °C, sale por una boquilla de 0.4 mm y se va depositando capa sobre capa hasta formar la pieza. La cama (la superficie sobre la que imprime) se calienta para que la primera capa se adhiera y no se levante al enfriarse.

    El método se llama **FDM** (*Fused Deposition Modeling*) y es el que hace el 95% de la impresión 3D doméstica. Existen otras tecnologías —resina (SLA/MSLA), polvo (SLS), metal— pero todas son significativamente más caras y técnicas.

    ## Los tres números que mandan en una impresión

    | Parámetro | Rango habitual | Qué cambia |
    |---|---|---|
    | **Altura de capa** | 0.12–0.28 mm | Acabado y tiempo. Capa fina = más detalle, hasta 3× más tiempo. |
    | **Velocidad** | 50–500 mm/s | Las máquinas modernas (Bambu X1, Prusa Core One) llegan a 300–500 mm/s reales sin perder calidad. Las antiguas, a 60. |
    | **Relleno** | 10–60% | Las piezas nunca son macizas: el interior es un patrón en panal. 15% para decoración, 40–60% para piezas funcionales. |

    ## Qué resuelve bien

    - **Repuestos descatalogados.** Pomos, tapas, engranajes pequeños, sujeciones de plástico que el fabricante ya no vende.
    - **Prototipos.** Validar una idea físicamente antes de pedir un molde de 3.000 €.
    - **Organización a medida.** Cubiletes que encajan exactos en tu cajón, no genéricos.
    - **Regalos personalizados.** Cosas únicas con nombre, foto o fecha.
    - **Soportes y adaptadores.** Para móviles, mandos, herramientas, montajes en pared.
    - **Miniaturas y figuras coleccionables.**

    ## Para qué *no* es la herramienta adecuada

    - **Series largas.** Pasados los 200–500 ejemplares, una inyección por molde sale más barata.
    - **Piezas que aguantan tensión continua bajo sol.** El PLA cede sobre los 60 °C; el ABS o ASA aguantan mejor, pero ninguna se acerca al aluminio.
    - **Acabado tipo cristal sin postprocesado.** Las capas siempre se ven. Se pueden lijar, vaporizar (ABS) o pintar, pero da trabajo.
    - **Estanqueidad perfecta.** Las capas dejan microporos. Se mejoran con paredes gruesas y materiales específicos, pero no es lo natural.

    ## El flujo, paso a paso

    1. **Modelo 3D**, en formato STL o 3MF. Lo descargas (Printables, MakerWorld) o lo encargas a un diseñador.
    2. **Laminado**: un programa (Orca Slicer, Bambu Studio, PrusaSlicer) traduce el modelo en las instrucciones que la impresora ejecuta capa a capa.
    3. **Impresión**: de 20 minutos a varios días, según tamaño.
    4. **Postprocesado**: retirar soportes, lijar uniones si es necesario, pintar si quieres.

    ## Si te ronda una idea

    Lo más útil suele ser una conversación corta. Trae el objeto roto, una foto de lo que necesitas o un enlace al modelo, y te decimos en el momento si tiene sentido imprimirlo, qué material conviene y cuánto cuesta. Puedes [pedir presupuesto online](/instant-quote) en un minuto o ver el [catálogo](/catalogo) para inspirarte.
