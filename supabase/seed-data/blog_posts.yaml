- slug: "como-calibrar-tu-impresora-3d"
  title: "Primera capa perfecta: por qué casi todo falla aquí, y cómo arreglarlo"
  excerpt: "El 90% de los fracasos en impresión 3D ocurren en los primeros 0.2 mm. Una rutina concreta de 5 pasos con valores reales y diagnóstico visual."
  content: |
    Una pieza que se cae a las ocho horas casi siempre falló en el minuto uno. Lo notas al despegarla: si la base se desprende con el dedo, ya empezó mal. Esta es la rutina exacta con la que repasamos una impresora cuando algo no sale como debería.

    > **Si solo lees una cosa, que sea esta:** la primera capa tiene que verse uniforme, con las líneas pegadas entre sí, sin huecos y sin que se note ningún surco al pasar la uña. Cualquier otra cosa es síntoma de algo mal.

    ## 1. Cama plana antes que nivelada

    Las impresoras modernas (Bambu, Prusa, Creality K-series) tienen un sensor que compensa la inclinación. Lo que no compensan es una cama **deformada**.

    Pon una regla metálica de canto sobre la cama, con la luz por detrás. Si ves luz colándose por debajo de la regla en alguna zona, la cama está abombada. El sensor solo puede compensar parcialmente: lo que ves en pantalla como "auto-level OK" en realidad es "ajustado lo que ha podido".

    **Solución rápida:** una cama nueva (PEI flexible, 25–35 €). Es la única forma de partir de algo plano.

    ## 2. Z-Offset: el número que más duele afinar

    Es la distancia real entre la boquilla y la cama durante la impresión. Aunque la auto-nivelación detecte la cama, este número se ajusta a mano y la diferencia entre 0.04 mm está bien y 0.06 mm está mal.

    **Cómo calibrarlo:**

    1. Imprime un cuadrado de una sola capa que cubra toda la zona útil.
    2. Mira las líneas paralelas que forman la superficie:

    | Síntoma | Diagnóstico | Acción |
    |---|---|---|
    | Líneas transparentes, plástico aplastado, brillante | Z demasiado bajo | Súbelo 0.02–0.04 mm |
    | Huecos visibles entre línea y línea | Z demasiado alto | Bájalo 0.02–0.04 mm |
    | Líneas que se ondulan o se mueven al imprimir | Z muy alto, no se pega | Bájalo 0.05 mm y limpia la cama |
    | Superficie lisa y mate, líneas pegadas | Correcto | No tocar |

    Repite cada 0.02 mm hasta clavarlo. Suelen ser 5 minutos.

    ## 3. Adhesión: la grasa es el enemigo

    Una cama nueva agarra cualquier cosa. Después de 50 impresiones acumula sebo de los dedos, polvo, restos de filamento.

    - **Para limpiar:** alcohol isopropílico al 90% (no al 70%, no rinde). Frota seco. Cada 10 impresiones.
    - **Si una zona concreta falla siempre:** un toque de barra de pegamento (Pritt sirve). Añade adherencia controlada y se quita con agua tibia. No abuses: pegamento sobre pegamento se acumula y luego despega trozos de cama.
    - **Errores frecuentes:** limpiar con producto desengrasante (deja residuo), tocar la cama con los dedos después de limpiar.

    ## 4. Temperatura: la etiqueta no es la verdad

    Las temperaturas que vienen en la bobina son una *recomendación*, no una verdad universal. Dos PLAs de marcas distintas con la misma etiqueta pueden necesitar 10 °C de diferencia.

    - **¿Las capas se separan en vertical?** Sube 5 °C el extrusor.
    - **¿Demasiado *stringing* (hilos entre paredes)?** Baja 5 °C.
    - **¿La primera capa no se pega y todo lo demás va bien?** Sube 5 °C la cama.
    - **¿Cambias de marca de filamento?** Imprime una torre de calibración de temperatura. Te ahorra horas de prueba y error.

    ## 5. La primera capa va más lenta. Siempre.

    Aunque tu impresora vaya a 300 mm/s, la primera capa debe ir a **20–30 mm/s**. Es la configuración por defecto del laminador; si la has tocado pensando que ibas a ganar tiempo, vuelve a los valores originales.

    El motivo: la primera capa necesita que el plástico tenga tiempo de fundirse contra la cama. A 100 mm/s no se pega. Los 60 segundos extra que tarda la primera capa se compensan con cero piezas tiradas a la basura.

    ## Cómo saber que está bien

    Pasa el dedo por la primera capa de cualquier impresión nuevita. Tiene que notarse **lisa**, sin crestas entre líneas. Si suena rugosa al rozar con la uña, todavía está alta y conviene bajar 0.02 mm el Z-offset.

    Diez minutos calibrando al principio te ahorran diez horas tirando piezas a la basura.
