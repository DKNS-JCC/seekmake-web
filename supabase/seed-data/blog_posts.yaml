- slug: "aplicaciones-practicas-impresion-3d-hogar"
  title: "10 cosas que imprimimos cada mes (y ninguna es una figurita)"
  excerpt: "Casos reales de impresión 3D útil en casa: reparaciones que salvan electrodomésticos, organización a medida y mejoras del día a día."
  content: |
    La imagen popular de la impresión 3D es la figurita decorativa. En el taller, las figuritas son la minoría. Esto es lo que de verdad imprimimos semana tras semana para clientes de Salamanca, con precios reales.

    ## 1. Repuestos de electrodomésticos descatalogados

    Caso típico: el bote de la batidora pierde la tapa en 2018, el fabricante ya no la hace, y la batidora pasa a la basura. Un repuesto impreso suele costar **4–8 €** y llega en 24–48 h. Salva un aparato de 80–200 €.

    El más satisfactorio de los usos. La pieza no tiene por qué ser idéntica al original: lo que importa es que encaje y aguante.

    ## 2. Pomos, tiradores y patas de mueble

    Muebles antiguos con un pomo perdido se replican a partir de los que quedan. Lo medimos o lo escaneamos y lo imprimimos en color a juego. **De 3 a 12 € por pomo**, depende del detalle.

    ## 3. Organización de cajones con Gridfinity

    Gridfinity es un estándar de la comunidad: una cuadrícula modular de 42×42 mm sobre la que encajan compartimentos de diferentes tamaños. Imprimes una base que se adapta exacta a tu cajón y vas montando cubiletes encima como Tetris.

    Funciona en cajones de cocina (cubiertos, especias), de taller (tornillos, brocas, llaves), de escritorio (cables, USB) y de baño. **8–15 € por cajón completo**.

    ## 4. Soportes de pared

    Para auriculares, cepillo de dientes eléctrico, mandos de consola, teléfonos antiguos, herramientas. Cualquier objeto con forma conocida puede colgar de la pared en una pieza hecha para encajar exactamente. **5–15 € por soporte**.

    ## 5. Adaptadores y conectores

    Una manguera de jardín que no se ajusta a una boquilla rara, dos tubos de aspirador con diámetros diferentes, una junta perdida de la cafetera. Pequeñas piezas que **ningún fabricante hace** y que un taller resuelve en una tarde. **5–10 €**.

    ## 6. Regalos personalizados

    Llaveros con nombre, placas para puertas, soportes con dedicatoria, marcos con la fecha de una boda. Pequeños, baratos (**4–18 €**) y con un valor sentimental que un objeto industrial nunca tiene.

    ## 7. Lithophanes (litofanías)

    Una foto convertida en una placa que, a contraluz, revela la imagen con sorprendente detalle. Regalo emocional que dura años. **12–20 €** según tamaño.

    ## 8. Réplicas y "prótesis" para juguetes

    El brazo del muñeco favorito se rompió. Lo modelamos, lo imprimimos, queda como nuevo. Si está fuera de producción esto puede salvar literalmente la Navidad.

    ## 9. Accesorios de jardín

    Etiquetas para macetas, soportes para riego por goteo, sujetadores para tutores de plantas. Se imprime en **PETG** (interior) o **ASA** (exterior expuesto al sol durante años) para que aguanten.

    ## 10. Mejoras de muebles IKEA

    Existe toda una subcultura de piezas impresas que añaden funciones que IKEA no incluyó: divisores extra para la cómoda Malm, soportes ocultos para el armario Pax, asas más cómodas para el carrito Råskog. Búscalo como "*IKEA hack*" en Printables y verás.

    ---

    > **Si tienes una de estas necesidades** y no quieres comprar una impresora ni aprender a diseñar, podemos hacerlo nosotros. Trae el objeto, una foto o describelo bien por WhatsApp y te decimos viabilidad y precio el mismo día.

