filamentos:
  PLA:
    nombre: "PLA"
    descripcion: "Filamentos de PLA son excelentes para impresiones visuales y prototipos rápidos. Resistencia moderada, precio asequible."
    colores:
    # Neutros
    - nombre: "Blanco Hielo"
      hex: "#FFFFFF"
    - nombre: "Beige"
      hex: "#f0e0d6"
    - nombre: "Gris Ceniza"
      hex: "#9CA3AF"
    - nombre: "Gris"
      hex: "#75787b"
    - nombre: "Negro Azabache"
      hex: "#000000"
    # Amarillos / Naranjas
    - nombre: "Amarillo Vainilla"
      hex: "#F3E5AB"
    - nombre: "Amarillo"
      hex: "#FFFF00"
    - nombre: "Dorado"
      hex: "#FBBF24"
      acabado: "Metálico"
    - nombre: "Cobre"
      hex: "#B87333"
      acabado: "Metálico"
    - nombre: "Bronce"
      hex: "#E0BB5A"
      acabado: "Metálico"
    # Rojos / Rosas
    - nombre: "Rojo Fórmula"
      hex: "#EF4444"
    - nombre: "Rosa Cerezo"
      hex: "#FFACA4"
    # Verdes
    - nombre: "Verde"
      hex: "#14C720"
    - nombre: "Verde Oliva"
      hex: "#636B2F"
    - nombre: "Verde Galaxia"
      hex: "#1A472A"
      acabado: "Purpurina"
    # Azules
    - nombre: "Azul Cobalto"
      hex: "#7DC6E5"
      acabado: "Metálico"
    - nombre: "Azul Eléctrico"
      hex: "#3B82F6"
    - nombre: "Azul Marino"
      hex: "#000080"
    # Morados
    - nombre: "Morado Bubble"
      hex: "#9333EA"
    # Especiales
    - nombre: "Plata"
      hex: "#C0C0C0"
      acabado: "Metálico"
    - nombre: "Mármol"
      hex: "#D1D5DB"
      acabado: "Textura"
    - nombre: "Naranja Fluorescente"
      hex: "#F97316"
      acabado: "Fluorescente"
    - nombre: "Verde Radiante"
      hex: "#39FF14"
      acabado: "Fluorescente"
    - nombre: "Amarillo Radiante"
      hex: "#FFFF33"
      acabado: "Fluorescente"

  PETG:
    nombre: "PETG"
    descripcion: "Material con mayor resistencia al impacto, temperatura y resistencia a químicos."
    colores:
    - nombre: "Blanco Hielo"
      hex: "#FFFFFF"
      acabado: "Brillante"
    - nombre: "Negro Azabache"
      hex: "#000000"
      acabado: "Brillante"
    - nombre: "Fibra de Carbono"
      hex: "#3B3B3B"
      acabado: "Textura"
    - nombre: "Verde Neon"
      hex: "#64ED6D"
      acabado: "Translucido"

  ASA:
    nombre: "ASA"
    descripcion: "Alta resistencia mecánica y durabilidad al exterior y productos químicos."
    colores:
    - nombre: "Negro Azabache"
      hex: "#000000"
      acabado: "Mate"

  TPU:
    nombre: "TPU"
    descripcion: "Material elástico, gran resistencia a la rotura y recuperación de forma original. Dureza 95A"
    colores:
    - nombre: "Negro"
      hex: "#000000"
      acabado: "Flexible"
