  PETG:
    nombre: "PETG"
    descripcion: "Material con mayor resistencia al impacto, temperatura y resistencia a químicos."
    colores:
      - nombre: "Blanco Hielo"
        hex: "#FFFFFF"
        texto: "black"

      - nombre: "Negro"
        hex: "#000000"
        texto: "white"
  
  ASA:
    nombre: "ASA"
    descripcion: "Alta resistencia mecánica y durabilidad al exterior y productos químicos."
    colores:
      - nombre: "Negro Azabache"
        hex: "#000000"
        texto: "white"

  
  TPU:
    nombre: "TPU"
    descripcion: "Material elástico, gran resistencia a la rotura y recuperación de forma original."
    colores:
      - nombre: "Negro (Shore 95A)"
        hex: "#000000"
        texto: "white"

