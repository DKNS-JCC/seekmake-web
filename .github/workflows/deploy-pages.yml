name: Deploy to GitHub Pages

# Static export of the Next.js app, deployed to GitHub Pages with the CNAME
# (impresion3dcc.com) preserved via public/CNAME.
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL       — Supabase project URL (public)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  — Supabase anon key (public)

on:
  # Rebuild on every push to main (immediate when code changes).
  #
  # Only main deploys. Any other branch pushing here would race the scheduled
  # rebuild below: `schedule` always runs from the default branch, so a deploy
  # from a feature branch gets reverted within 15 minutes. Merge to main
  # instead.
  push:
    branches: [main]

  # Manual trigger from the Actions tab.
  workflow_dispatch:

  # External trigger from a Supabase Edge Function or webhook.
  # Body: { "event_type": "rebuild" }
  repository_dispatch:
    types: [rebuild]

  # Scheduled rebuild every 15 minutes so blog posts and catalog changes go
  # live without any manual action. GitHub may queue a few minutes late on
  # the free tier; expect 15–25 min worst case.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The quote page prices in the browser and submit-quote re-prices on the
      # server; a web newer than the deployed function would show one price
      # and email another. Publish only once the function speaks this version
      # (deploy-supabase.yml deploys it and then re-runs this workflow).
      - name: Comprobar la función del tasador (submit-quote)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          esperada=$(grep -oP "TASADOR_VERSION = '\K[^']+" supabase/functions/submit-quote/index.ts)
          desplegada=$(curl -s -m 20 -D - -o /dev/null \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" \
            "$SUPABASE_URL/functions/v1/submit-quote" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="x-tasador-version"{print $2}')
          echo "submit-quote desplegada: '${desplegada:-antigua}' · esperada: '$esperada'"
          if [ "$desplegada" != "$esperada" ]; then
            echo "::error::submit-quote en Supabase no es la versión $esperada. Ejecuta el workflow 'Deploy Supabase' (o 'supabase functions deploy submit-quote') y esta web se publicará sola."
            exit 1
          fi

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
