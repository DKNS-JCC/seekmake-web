name: Deploy Supabase

# Applies NEW migrations and deploys CHANGED Edge Functions when they land on
# main, then republishes the web (deploy-pages.yml refuses to publish a web
# that needs a newer submit-quote than the one deployed).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — Project Settings → Database → password (db.key)
#
# Manual run (Actions → Deploy Supabase → Run workflow): pass the migration
# files and/or functions to deploy explicitly.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      migraciones:
        description: 'Migraciones a aplicar (rutas separadas por espacios, vacío = ninguna)'
        required: false
        default: ''
      funciones:
        description: 'Funciones a desplegar (nombres separados por espacios)'
        required: false
        default: 'submit-quote'

permissions:
  contents: read
  actions: write

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Functions called without a user JWT (see their headers).
      NO_VERIFY_JWT: 'quote-file envios-cotizar'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Qué desplegar
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            migraciones="${{ inputs.migraciones }}"
            funciones="${{ inputs.funciones }}"
          else
            antes="${{ github.event.before }}"
            if ! git cat-file -e "$antes" 2>/dev/null; then antes="HEAD~1"; fi
            # Only migration files ADDED in this push: they are one-shot.
            migraciones=$(git diff --name-only --diff-filter=A "$antes" "${{ github.sha }}" -- 'supabase/migrations/*.sql' | sort | tr '\n' ' ')
            cambiadas=$(git diff --name-only "$antes" "${{ github.sha }}" -- 'supabase/functions/' | cut -d/ -f3 | sort -u)
            if echo "$cambiadas" | grep -qx '_shared'; then
              funciones=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_' | tr '\n' ' ')
            else
              # xargs, not tr: with no changes echo leaves a lone "\n" that tr turns into " " (non-empty).
              funciones=$(echo "$cambiadas" | grep -v '^_' | grep -v '\.json$' | xargs)
            fi
          fi
          echo "migraciones=$migraciones" >> "$GITHUB_OUTPUT"
          echo "funciones=$funciones" >> "$GITHUB_OUTPUT"
          echo "Migraciones: ${migraciones:-ninguna}"
          echo "Funciones: ${funciones:-ninguna}"

      - name: Comprobar secretos
        run: |
          falta=""
          [ -n "${{ steps.plan.outputs.migraciones }}" ] && [ -z "$SUPABASE_DB_PASSWORD" ] && falta="$falta SUPABASE_DB_PASSWORD"
          [ -n "${{ steps.plan.outputs.funciones }}" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ] && falta="$falta SUPABASE_ACCESS_TOKEN"
          if [ -n "$falta" ]; then
            echo "::error::Faltan los secretos del repositorio:$falta (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Setup Node
        if: steps.plan.outputs.migraciones != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Aplicar migraciones
        if: steps.plan.outputs.migraciones != ''
        run: |
          npm ci
          printf '%s' "$SUPABASE_DB_PASSWORD" > db.key
          for m in ${{ steps.plan.outputs.migraciones }}; do
            node scripts/apply-migration.mjs "$m"
          done
          rm -f db.key

      - name: Setup Supabase CLI
        if: steps.plan.outputs.funciones != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar funciones
        if: steps.plan.outputs.funciones != ''
        run: |
          ref=$(cat supabase/.temp/project-ref)
          for f in ${{ steps.plan.outputs.funciones }}; do
            [ -d "supabase/functions/$f" ] || continue
            extra=""
            if echo " $NO_VERIFY_JWT " | grep -q " $f "; then extra="--no-verify-jwt"; fi
            echo "▸ $f $extra"
            supabase functions deploy "$f" --project-ref "$ref" --use-api --yes $extra
          done

      - name: Republicar la web
        if: steps.plan.outputs.funciones != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
